services:
  mongodb-prod:
    image: "mongo:8"
    restart: always
    expose:
      - "27017"
    env_file:
      - "./backend/.env"
    volumes:
      - data-db-prod:/data/db
      - data-configdb-prod:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  backend-prod:
    build:
      context: ./backend/
      dockerfile: Dockerfile-prod
    restart: always
    expose:
      - "6200"
    # Secrets are injected at runtime rather than baked into the image
    env_file:
      - "./backend/.env"
    depends_on:
      mongodb-prod:
        condition: service_healthy

  frontend-prod:
    build:
      context: ./frontend/
      dockerfile: Dockerfile-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  data-db-prod:
  data-configdb-prod:
