name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  images:
    name: docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Both .env files are gitignored, so CI has to synthesise them. The
      # frontend build inlines VITE_* values at build time, and both compose
      # files reference backend/.env via env_file, which `config` resolves.
      # Placeholders only - this job proves the images build, it deploys nothing.
      - name: Placeholder env files
        run: |
          printf 'VITE_STRAVA_CLIENT_ID=0\nVITE_MAP_CENTRE=51.43,-2.19\n' > frontend/.env
          printf 'STRAVA_CLIENT_ID=0\nSTRAVA_CLIENT_SECRET=ci\nJWT_SECRET=ci\nMONGO_INITDB_ROOT_USERNAME=ci\nMONGO_INITDB_ROOT_PASSWORD=ci\n' > backend/.env

      - name: Build backend image
        run: docker build -f backend/Dockerfile-prod -t routeapp-backend:ci backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile-prod -t routeapp-frontend:ci frontend

      - name: Validate compose files
        run: |
          docker compose -f docker-compose-dev.yml config -q
          docker compose -f docker-compose-prod.yml config -q
