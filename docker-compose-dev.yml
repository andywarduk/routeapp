services:
  mongodb-dev:
    image: "mongo:8"
    ports:
      - "27017:27017"
    env_file:
      - "./backend/.env"
    volumes:
      - data-db-dev:/data/db
      - data-configdb-dev:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks:
      - dev_default

  backend-dev:
    build:
      context: ./backend/
      dockerfile: Dockerfile-dev
    ports:
      - "6200:6200"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/build
    env_file:
      - "./backend/.env"
    depends_on:
      mongodb-dev:
        condition: service_healthy
    networks:
      - dev_default

  frontend-dev:
    build:
      context: ./frontend/
      dockerfile: Dockerfile-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-dev
    networks:
      - dev_default

volumes:
  data-db-dev:
  data-configdb-dev:

networks:
  dev_default:
